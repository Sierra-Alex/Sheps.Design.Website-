<x-dc>

<div style="display:flex;flex-direction:column;width:100%;">

        <p style="margin:0;text-wrap:pretty;">Start something at <a href="mailto:alex@sheps.studio" data-copy-email="alex@sheps.studio" data-copy-tip="above" data-cta-location="footer-bio" title="Copy email address" style="color:#131313;text-decoration:underline dotted #131313;text-decoration-thickness:1.5px;text-underline-offset:5px;cursor:copy;" style-hover="text-decoration-style:solid;">alex@sheps.studio</a>.</p>
      </div>
      </sc-if>
    </div>
  </div>
</section>
</sc-if>
<div ref="{{ modalRef }}" aria-hidden="{{ modalHidden }}" inert="{{ modalInert }}" onPointerDown="{{ backdropDown }}" style="position:fixed;inset:0;z-index:200;display:flex;align-items:stretch;justify-content:stretch;padding:16px;background:#13131366;backdrop-filter:blur(2px);opacity:{{ modalOpacity }};visibility:{{ modalVisibility }};pointer-events:{{ modalPE }};transition:opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;">
