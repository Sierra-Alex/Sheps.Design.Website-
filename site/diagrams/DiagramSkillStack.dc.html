<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  @keyframes wfdash { to { background-position-x: 14px; } }
  @keyframes wfdashy { to { background-position-y: 14px; } }
</style>
</helmet>
<div ref="{{ rootRef }}" style="width:100%; container-type:inline-size; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; letter-spacing:0.02em; line-height:1.35">
  <sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column">
      <div style="display:flex; flex-direction:column; gap:4px; padding:12px 16px; border:1px solid #F7F3F133; border-radius:4px">
        <div style="font-size:14px; font-weight:600; color:#F7F3F1">Design system</div>
        <div style="font-size:12px; color:#949191">Tokens, components and rules</div>
      </div>
      <div aria-hidden="true" style="display:flex; align-items:center; gap:12px; padding-left:24px">
        <div style="width:1.2px; height:32px; background-image:repeating-linear-gradient(to bottom, #F7F3F133 0 6px, transparent 6px 14px); background-size:100% 14px; animation:wfdashy 900ms linear infinite"></div>
        <span style="font-size:12px; color:#949191">saved to</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; padding:12px 16px; border:1px solid #FDBB6F; border-radius:4px">
        <div style="font-size:14px; font-weight:600; color:#F7F3F1">Your code repo</div>
        <div style="font-size:12px; color:#949191">GitHub, or wherever your code lives</div>
      </div>
      <div aria-hidden="true" style="display:flex; align-items:center; gap:12px; padding-left:24px">
        <div style="width:1.2px; height:32px; background-image:repeating-linear-gradient(to bottom, #F7F3F133 0 6px, transparent 6px 14px); background-size:100% 14px; animation:wfdashy 900ms linear infinite"></div>
        <span style="font-size:12px; color:#949191">referenced by</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px">
        <sc-for list="{{ skills }}" as="s" hint-placeholder-count="3">
          <div onMouseEnter="{{ s.enter }}" onMouseLeave="{{ s.leave }}" style="display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 8px; padding:12px 16px; border:1px solid {{ s.stroke }}; border-radius:4px; opacity:{{ s.opacity }}; transition:opacity 200ms ease, border-color 200ms ease">
            <div style="font-size:14px; font-weight:600; color:#F7F3F1">{{ s.name }}</div>
            <div style="font-size:12px; color:#949191">Its own skill</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
  <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(4cqw,0.5fr) minmax(0,1fr) minmax(4cqw,0.5fr) minmax(0,1fr); grid-template-rows:repeat(3, 1fr); row-gap:1.2cqw; align-items:center">

    <div style="grid-column:1; grid-row:1 / 4; display:flex; flex-direction:column; gap:0.4cqw; padding:1.4cqw 1.6cqw; border:1px solid #F7F3F133; border-radius:4px">
      <div style="font-size:clamp(11px, 1.5cqw, 16px); font-weight:600; color:#F7F3F1">Design system</div>
      <div style="font-size:clamp(10px, 1.25cqw, 14px); color:#949191">Tokens, components and rules</div>
    </div>

    <div aria-hidden="true" style="grid-column:2; grid-row:1 / 4; display:flex; flex-direction:column; align-items:center; gap:0.5cqw">
      <span style="font-size:clamp(9px, 1.05cqw, 12px); color:#949191; white-space:nowrap">saved to</span>
      <div style="width:100%; height:1.2px; background-image:repeating-linear-gradient(to right, #F7F3F133 0 6px, transparent 6px 14px); background-size:14px 100%; animation:wfdash 900ms linear infinite"></div>
      <span style="font-size:clamp(9px, 1.05cqw, 12px); visibility:hidden">x</span>
    </div>

    <div style="grid-column:3; grid-row:1 / 4; display:flex; flex-direction:column; gap:0.4cqw; padding:1.4cqw 1.6cqw; border:1px solid #FDBB6F; border-radius:4px">
      <div style="font-size:clamp(11px, 1.5cqw, 16px); font-weight:600; color:#F7F3F1">Your code repo</div>
      <div style="font-size:clamp(10px, 1.25cqw, 14px); color:#949191">GitHub, or wherever your code lives</div>
    </div>

    <div aria-hidden="true" style="grid-column:4; grid-row:1 / 4; align-self:stretch; position:relative">
      <div style="position:absolute; left:0; width:50%; top:50%; height:1.2px; background-image:repeating-linear-gradient(to right, #F7F3F133 0 6px, transparent 6px 14px); background-size:14px 100%; animation:wfdash 900ms linear infinite"></div>
      <div style="position:absolute; left:50%; top:calc((100% - 2.4cqw) / 6); bottom:calc((100% - 2.4cqw) / 6); width:1.2px; background-image:repeating-linear-gradient(to bottom, #F7F3F133 0 6px, transparent 6px 14px); background-size:100% 14px; animation:wfdashy 900ms linear infinite"></div>
      <span style="position:absolute; left:50%; top:50%; transform:translate(-50%, -140%); padding:0 0.4cqw; background:#131313; font-size:clamp(9px, 1.05cqw, 12px); color:#949191; white-space:nowrap">referenced by</span>
    </div>

    <sc-for list="{{ skills }}" as="s" hint-placeholder-count="3">
      <div style="grid-column:4 / 6; grid-row:{{ s.row }}; display:grid; grid-template-columns:minmax(4cqw,0.5fr) minmax(0,1fr); align-items:center">
        <div aria-hidden="true" style="margin-left:50%; height:1.2px; background-image:repeating-linear-gradient(to right, #F7F3F133 0 6px, transparent 6px 14px); background-size:14px 100%; animation:wfdash 900ms linear infinite"></div>
        <div onMouseEnter="{{ s.enter }}" onMouseLeave="{{ s.leave }}" style="display:flex; flex-direction:column; gap:0.2cqw; padding:1cqw 1.4cqw; border:1px solid {{ s.stroke }}; border-radius:4px; opacity:{{ s.opacity }}; transition:opacity 200ms ease, border-color 200ms ease">
          <div style="font-size:clamp(11px, 1.5cqw, 16px); font-weight:600; color:#F7F3F1; white-space:nowrap">{{ s.name }}</div>
          <div style="font-size:clamp(9px, 1.05cqw, 12px); color:#949191">Its own skill</div>
        </div>
      </div>
    </sc-for>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SKILLS = [
  { id: 'deck', name: 'Deck builder' },
  { id: 'landing', name: 'Landing page builder' },
  { id: 'onepager', name: 'One-pager builder' }
];
class Component extends DCLogic {
  __standaloneBg = (() => { try { if (decodeURIComponent(location.pathname).includes('DiagramSkillStack')) { document.documentElement.style.background = '#131313'; document.body.style.background = '#131313'; } } catch (e) {} })();
  rootRef = React.createRef();
  state = { compact: typeof window !== 'undefined' && window.innerWidth < 688, hover: null };
  componentDidMount() {
    if (typeof ResizeObserver !== 'undefined' && this.rootRef.current) {
      this._wro = new ResizeObserver((es) => { const c = es[0].contentRect.width < 640; if (c !== !!this.state.compact) this.setState({ compact: c }); });
      this._wro.observe(this.rootRef.current);
    }
  }
  componentWillUnmount() { if (this._wro) this._wro.disconnect(); }
  renderVals() {
    const h = this.state.hover;
    return {
      rootRef: this.rootRef,
      compact: this.state.compact ? true : null,
      wide: this.state.compact ? null : true,
      skills: SKILLS.map((s, i) => ({
        ...s,
        row: String(i + 1),
        stroke: h === s.id ? '#FDBB6F' : '#F7F3F133',
        opacity: !h || h === s.id ? 1 : 0.5,
        enter: () => this.setState({ hover: s.id }),
        leave: () => this.setState({ hover: null })
      }))
    };
  }
}
</script>
</body>
</html>
