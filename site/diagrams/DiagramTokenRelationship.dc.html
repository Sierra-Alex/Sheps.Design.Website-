<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  @keyframes wfflow { to { stroke-dashoffset: -14; } }
  @keyframes wfliftA { 0% { filter: brightness(1); } 34% { filter: brightness(0.965); } 100% { filter: brightness(1); } }
  @keyframes wfliftB { 0% { filter: brightness(1); } 34% { filter: brightness(0.965); } 100% { filter: brightness(1); } }
</style>
</helmet>
<div ref="{{ rootRef }}" style="width:100%; box-sizing:border-box; padding:0; display:flex; flex-direction:column; gap:16px; font-family:'Inter', system-ui, sans-serif">
  <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; font-size:12px; line-height:130%; letter-spacing:0.02em">
    <p style="margin:0; color:#949191">{{ lensHint }}</p>
    <div role="radiogroup" aria-label="Read the tokens as" style="position:relative; display:grid; grid-template-columns:1fr 1fr; padding:2px; border:1px solid #F7F3F11A; border-radius:4px; background:#F7F3F108">
      <span aria-hidden="true" style="position:absolute; top:2px; bottom:2px; left:2px; width:calc(50% - 2px); border-radius:2px; background:#F7F3F1; transform:translateX({{ lensShift }}); transition:transform 260ms cubic-bezier(0.22, 1, 0.36, 1)"></span>
      <button type="button" role="radio" aria-checked="{{ isHuman }}" onClick="{{ showHuman }}" style="appearance:none; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:6px 12px; border:0; background:transparent; color:{{ humanLabel }}; font:inherit; font-weight:500; cursor:pointer; transition:color 200ms ease">Human</button>
      <button type="button" role="radio" aria-checked="{{ isAgent }}" onClick="{{ showAgent }}" style="appearance:none; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:4px; padding:6px 12px; border:0; background:transparent; color:{{ agentLabel }}; font:inherit; font-weight:500; cursor:pointer; transition:color 200ms ease">Agent</button>
    </div>
  </div>
  <sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column">
      <sc-for list="{{ stack }}" as="n" hint-placeholder-count="3">
        <div style="display:flex; flex-direction:column; align-items:flex-start">
          <sc-if value="{{ n.notFirst }}" hint-placeholder-val="{{ false }}">
            <div aria-hidden="true" style="margin-left:24px; width:1.2px; height:24px; background-image:repeating-linear-gradient(to bottom, #F7F3F133 0 6px, transparent 6px 14px); background-size:100% 14px"></div>
          </sc-if>
          <div onClick="{{ n.tap }}" style="cursor:pointer; width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; padding:16px; border-radius:4px; border:1px solid {{ n.cardStroke }}; opacity:{{ n.opacity }}; transition:opacity 200ms ease">
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px; line-height:130%; letter-spacing:0.02em; color:#F7F3F1">
              <span style="font-weight:600">{{ n.label }}</span>
              <span aria-hidden="true" style="width:1px; height:11px; background:#F7F3F1"></span>
              <span>{{ n.descriptor }}</span>
            </div>
            <p style="margin:0; font-size:12px; line-height:145%; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ n.caption }}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
  <div ref="{{ canvasRef }}" style="width:100%; max-width:none; container-type:inline-size; position:relative; aspect-ratio:1049 / 120; background:transparent; border-radius:4px; overflow:visible; box-sizing:border-box">


    

    <svg viewBox="0 0 1049 120" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible">
      <sc-for list="{{ edges }}" as="e" hint-placeholder-count="2">
        <path d="{{ e.d }}" fill="none" stroke="{{ e.stroke }}" strokeWidth="1.2" strokeLinecap="round" strokeDasharray="{{ e.dash }}" opacity="{{ e.opacity }}" style="animation:{{ e.anim }}"></path>
      </sc-for>
    </svg>

    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="3">
      <div ref="{{ n.ref }}" onMouseEnter="{{ n.enter }}" onMouseLeave="{{ n.leave }}" onPointerDown="{{ n.down }}" style="cursor:{{ n.cursor }}; touch-action:none; user-select:none; position:absolute; left:{{ n.left }}; top:{{ n.top }}; width:{{ n.width }}; box-sizing:border-box; display:flex; flex-direction:column; gap:0.76cqw; padding:1.53cqw; border-radius:4px; background:{{ n.cardBg }}; border:1px solid {{ n.cardStroke }}; animation:{{ n.anim }}; opacity:{{ n.opacity }}; transition:opacity 200ms ease; z-index:2">
        <div style="display:flex; align-items:center; gap:0.76cqw">
          <svg viewBox="0 0 16 16" style="flex:none; width:1.53cqw; height:1.53cqw; display:block; color:#F7F3F1">
            <g transform="translate(3.5 2.273)">
              <path d="M 1.023 0 C 0.458 0 0 0.458 0 1.023 L 0 10.432 C 0 10.996 0.458 11.455 1.023 11.455 L 7.977 11.455 C 8.542 11.455 9 10.996 9 10.432 L 9 6.136 C 9 5.594 8.784 5.074 8.401 4.69 C 8.017 4.306 7.497 4.091 6.955 4.091 L 5.932 4.091 C 5.661 4.091 5.4 3.983 5.209 3.791 C 5.017 3.6 4.909 3.339 4.909 3.068 L 4.909 2.045 C 4.909 1.503 4.694 0.983 4.31 0.599 C 3.926 0.216 3.406 0 2.864 0 L 1.023 0 Z M 2.045 7.364 C 2.045 7.255 2.089 7.151 2.165 7.074 C 2.242 6.998 2.346 6.955 2.455 6.955 L 6.545 6.955 C 6.654 6.955 6.758 6.998 6.835 7.074 C 6.911 7.151 6.955 7.255 6.955 7.364 C 6.955 7.472 6.911 7.576 6.835 7.653 C 6.758 7.73 6.654 7.773 6.545 7.773 L 2.455 7.773 C 2.346 7.773 2.242 7.73 2.165 7.653 C 2.089 7.576 2.045 7.472 2.045 7.364 Z M 2.455 8.591 C 2.346 8.591 2.242 8.634 2.165 8.711 C 2.089 8.787 2.045 8.892 2.045 9 C 2.045 9.108 2.089 9.213 2.165 9.289 C 2.242 9.366 2.346 9.409 2.455 9.409 L 4.5 9.409 C 4.608 9.409 4.713 9.366 4.789 9.289 C 4.866 9.213 4.909 9.108 4.909 9 C 4.909 8.892 4.866 8.787 4.789 8.711 C 4.713 8.634 4.608 8.591 4.5 8.591 L 2.455 8.591 Z" fill="currentColor" fillRule="evenodd"></path>
            </g>
            <g transform="translate(8.529 2.445)">
              <path d="M 0 0 C 0.451 0.52 0.699 1.185 0.698 1.873 L 0.698 2.896 C 0.698 3.009 0.789 3.1 0.902 3.1 L 1.925 3.1 C 2.613 3.099 3.278 3.347 3.798 3.798 C 3.558 2.885 3.08 2.053 2.413 1.385 C 1.745 0.718 0.913 0.24 0 0 Z" fill="currentColor" fillRule="nonzero"></path>
            </g>
          </svg>
          <span style="font-size:1.335cqw; font-weight:600; letter-spacing:0.02em; color:#F7F3F1; white-space:nowrap">{{ n.label }}</span>
          <span style="flex:none; width:1px; height:1.05cqw; background:#F7F3F1"></span>
          <span style="font-size:1.335cqw; font-weight:400; letter-spacing:0.02em; color:#F7F3F1; white-space:nowrap">{{ n.descriptor }}</span>
        </div>
        <div style="font-size:1.144cqw; font-weight:400; line-height:1.45; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ n.caption }}</div>
      </div>
    </sc-for>

    <svg viewBox="0 0 1049 120" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:4">
      <sc-for list="{{ ports }}" as="p" hint-placeholder-count="4">
        <circle cx="{{ p.x }}" cy="{{ p.y }}" r="5" fill="#131313" stroke="#F7F3F133" strokeWidth="1.2" opacity="{{ p.opacity }}"></circle>
      </sc-for>
    </svg>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pastel&quot;,&quot;muted&quot;,&quot;taupe&quot;,&quot;slate&quot;,&quot;sage&quot;,&quot;bold&quot;,&quot;signal&quot;],&quot;default&quot;:&quot;signal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.34,&quot;min&quot;:0.05,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Interaction&quot;}}">
const W = 1049, H = 120;

const PALETTES = [
  { id: 'pastel', name: 'Pastel', tint: '#9CD3C11F', stroke: '#9CD3C1' },
  { id: 'muted',  name: 'Muted',  tint: '#A9B7A01F', stroke: '#A9B7A0' },
  { id: 'taupe',  name: 'Taupe',  tint: '#C6AE971F', stroke: '#C6AE97' },
  { id: 'slate',  name: 'Slate',  tint: '#9DB0BF1F', stroke: '#9DB0BF' },
  { id: 'sage',   name: 'Sage',   tint: '#9CC3B21F', stroke: '#9CC3B2' },
  { id: 'bold',   name: 'Bold',   tint: '#4FC0A11F', stroke: '#4FC0A1' },
  { id: 'signal', name: 'Signal', tint: '#FDBB6F1F', stroke: '#FDBB6F' }
];
const GROUND = 'transparent';

const NODES = [
  { id: 'value', label: 'Value', descriptor: 'A fact', x: 0, w: 321.67, fill: false,
    human: 'The raw hex, number, or pixel. True, but it says nothing about where it belongs.',
    agent: 'Primary? Error? A one-off? The agent has to guess.' },
  { id: 'prim', label: 'Primitive token', descriptor: 'A named fact', x: 363.67, w: 321.67, fill: true,
    human: 'A name attached to the value, so it can be referenced once and changed in one place.',
    agent: 'A name it can reference — but still no intent.' },
  { id: 'sem', label: 'Semantic token', descriptor: 'A job', x: 727.33, w: 321.67, fill: true,
    human: 'A name for the job the value does, so intent travels with it everywhere it lands.',
    agent: 'Exactly what the value is for. Nothing left to infer.' }
];

const ORDER = ['value', 'prim', 'sem'];
const SEGS = [['value', 'prim'], ['prim', 'sem']];
const pctX = (v) => (v / W * 100) + '%';
const pctY = (v) => (v / H * 100) + '%';

class Component extends DCLogic {
  __standaloneBg = (() => { try { if (decodeURIComponent(location.pathname).includes('DiagramTokenRelationship')) { document.documentElement.style.background = '#131313'; document.body.style.background = '#131313'; } } catch (e) {} })();
  state = { compact: typeof window !== 'undefined' && window.innerWidth < 808, palette: 0, picked: false, propAt: null, lens: 'human', hover: null, fired: null, seq: 0, heights: {}, canvasPx: 0, pos: {}, dragging: null };

  constructor(props) {
    super(props);
    this.canvasRef = React.createRef();
    this.rootRef = React.createRef();
    this.cardEls = {};
    this._refs = {};
    this.setCardEl = (id) => {
      if (!this._refs[id]) {
        this._refs[id] = (el) => {
          if (el) {
            this.cardEls[id] = el;
            if (this._ro) this._ro.observe(el);
          }
        };
      }
      return this._refs[id];
    };
  }

  componentDidMount() {
    if (typeof ResizeObserver !== 'undefined' && this.rootRef.current) {
      this._wro = new ResizeObserver((es) => { const c = es[0].contentRect.width < 760; if (c !== !!this.state.compact) this.setState({ compact: c }); });
      this._wro.observe(this.rootRef.current);
    }
    if (typeof ResizeObserver !== 'undefined') {
      this._ro = new ResizeObserver(() => this.measure());
      if (this.canvasRef.current) this._ro.observe(this.canvasRef.current);
      Object.keys(this.cardEls).forEach((id) => this._ro.observe(this.cardEls[id]));
    }
    this.measure();
  }

  componentDidUpdate() { this.measure(); }

  measure() {
    const canvas = this.canvasRef.current;
    if (!canvas) return;
    const canvasPx = canvas.getBoundingClientRect().width;
    const next = {};
    let changed = Math.abs(canvasPx - this.state.canvasPx) > 0.5;
    Object.keys(this.cardEls).forEach((id) => {
      const h = this.cardEls[id].getBoundingClientRect().height;
      next[id] = h;
      if (Math.abs((this.state.heights[id] || 0) - h) > 0.5) changed = true;
    });
    if (changed) this.setState({ heights: next, canvasPx });
  }

  componentWillUnmount() {
    clearTimeout(this._t);
    if (this._ro) this._ro.disconnect();
    if (this._wro) this._wro.disconnect();
    this.detach();
  }

  detach() {
    if (!this._onMove) return;
    window.removeEventListener('pointermove', this._onMove);
    window.removeEventListener('pointerup', this._onUp);
    this._onMove = null;
    this._onUp = null;
  }

  startDrag(e, id, bounds) {
    if (e.button !== undefined && e.button !== 0) return;
    const base = this.state.pos[id] || { dx: 0, dy: 0 };
    const scale = this.state.canvasPx ? this.state.canvasPx / W : 1;
    const sx = e.clientX, sy = e.clientY;
    let moved = false;
    this.setState({ dragging: id });

    this._onMove = (ev) => {
      const ddx = (ev.clientX - sx) / scale;
      const ddy = (ev.clientY - sy) / scale;
      if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 3) moved = true;
      if (!moved) return;
      const dx = Math.min(Math.max(base.dx + ddx, bounds.minDx), bounds.maxDx);
      const dy = Math.min(Math.max(base.dy + ddy, bounds.minDy), bounds.maxDy);
      this.setState((st) => ({ pos: Object.assign({}, st.pos, { [id]: { dx, dy } }) }));
    };

    this._onUp = () => {
      this.detach();
      this.setState({ dragging: null });
      if (!moved) this.fire(id);
    };

    window.addEventListener('pointermove', this._onMove);
    window.addEventListener('pointerup', this._onUp);
  }

  fire(id) {
    if (this.state.fired === id) return;
    this.setState((s) => ({ fired: id, seq: s.seq + 1 }));
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ fired: null }), 1500);
  }

  renderVals() {
    const dim = this.props.dimOpacity ?? 0.34;
    const lens = this.state.lens;
    const propId = this.props.palette ?? 'signal';
    const wanted = (this.state.picked && this.state.propAt === propId) ? PALETTES[this.state.palette].id : propId;
    const pIndex = Math.max(0, PALETTES.findIndex((p) => p.id === wanted));
    const skin = PALETTES[pIndex];
    const anchor = this.state.fired || this.state.hover;
    const ai = anchor ? ORDER.indexOf(anchor) : -1;
    const depth = (id) => (ai < 0 ? undefined : (ORDER.indexOf(id) >= ai ? ORDER.indexOf(id) - ai : undefined));
    const phase = this.state.seq % 2 ? 'wfliftA' : 'wfliftB';
    const hovering = !!this.state.hover;

    const scale = this.state.canvasPx ? this.state.canvasPx / W : 0;
    const hOf = (id) => {
      const px = this.state.heights[id];
      return scale && px ? px / scale : 101;
    };
    const tallest = Math.max.apply(null, NODES.map((n) => hOf(n.id)));
    const baseTop = (H - tallest) / 2;
    const pos = this.state.pos;
    const off = (n) => pos[n.id] || { dx: 0, dy: 0 };
    const xOf = (n) => n.x + off(n).dx;
    const yOf = (n) => baseTop + off(n).dy;
    const PAD = 0;
    const boundsFor = (n) => ({
      minDx: PAD - n.x,
      maxDx: W - PAD - n.w - n.x,
      minDy: PAD - baseTop,
      maxDy: H - PAD - hOf(n.id) - baseTop
    });

    const nodes = NODES.map((n) => {
      const d = depth(n.id);
      const on = ai < 0 || d !== undefined;
      return {
        id: n.id,
        label: n.label,
        descriptor: n.descriptor,
        caption: lens === 'agent' ? n.agent : n.human,
        cardBg: GROUND,
        cardStroke: skin.stroke,
        ref: this.setCardEl(n.id),
        left: pctX(xOf(n)),
        top: pctY(yOf(n)),
        width: pctX(n.w),
        opacity: on ? 1 : dim,
        anim: (d === undefined || hovering) ? 'none' : phase + ' 620ms ease-in-out ' + (d * 130) + 'ms both',
        cursor: this.state.dragging === n.id ? 'grabbing' : 'grab',
        enter: () => { if (!this.state.dragging) this.setState({ hover: n.id }); },
        leave: () => this.setState({ hover: null }),
        down: (e) => this.startDrag(e, n.id, boundsFor(n))
      };
    });

    const byId = {};
    NODES.forEach((n) => { byId[n.id] = n; });
    const mid = (n) => yOf(n) + hOf(n.id) / 2;
    const rightX = (n) => xOf(n) + n.w;
    const leftX = (n) => xOf(n);

    const edges = SEGS.map((pair, i) => {
      const a = byId[pair[0]], b = byId[pair[1]];
      const x1 = rightX(a), y1 = mid(a), x2 = leftX(b), y2 = mid(b);
      const bend = (x2 - x1) * 0.55;
      const live = depth(pair[0]) !== undefined && depth(pair[1]) !== undefined;
      return {
        d: 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + bend) + ' ' + y1 + ', ' + (x2 - bend) + ' ' + y2 + ', ' + x2 + ' ' + y2,
        stroke: live ? '#9A9792' : '#F7F3F133',
        dash: live ? '6 8' : 'none',
        opacity: ai < 0 ? 1 : (live ? 1 : dim * 0.8),
        anim: live ? 'wfflow 620ms linear infinite ' + (i * -0.12) + 's' : 'none'
      };
    });

    const ports = [];
    SEGS.forEach((pair) => {
      const a = byId[pair[0]], b = byId[pair[1]];
      ports.push({ x: rightX(a), y: mid(a), opacity: (ai < 0 || depth(pair[0]) !== undefined) ? 1 : dim });
      ports.push({ x: leftX(b), y: mid(b), opacity: (ai < 0 || depth(pair[1]) !== undefined) ? 1 : dim });
    });

    return {
      nodes, edges, ports,
      canvasRef: this.canvasRef,
      rootRef: this.rootRef,
      compact: this.state.compact ? true : null,
      wide: this.state.compact ? null : true,
      stack: nodes.map((n, i) => ({ label: n.label, descriptor: n.descriptor, caption: n.caption, cardStroke: n.cardStroke, opacity: n.opacity, notFirst: i > 0 ? true : null, tap: () => this.fire(n.id) })),
      swatches: PALETTES.map((p, i) => ({
        name: p.name,
        dot: p.stroke,
        ink: i === pIndex ? '#F7F3F1' : '#949191',
        line: i === pIndex ? '#F7F3F1' : 'transparent',
        pick: () => this.setState({ palette: i, picked: true, propAt: propId })
      })),
      humanLine: lens === 'human' ? '#F7F3F1' : 'transparent',
      humanInk: lens === 'human' ? '#F7F3F1' : '#949191',
      agentLine: lens === 'agent' ? '#F7F3F1' : 'transparent',
      agentInk: lens === 'agent' ? '#F7F3F1' : '#949191',
      isAgent: lens === 'agent',
      knobLeft: lens === 'agent' ? '16px' : '2px',
      humanLabel: lens === 'agent' ? '#949191' : '#131313',
      agentLabel: lens === 'agent' ? '#131313' : '#949191',
      isHuman: lens !== 'agent',
      lensShift: lens === 'agent' ? '100%' : '0%',
      lensHint: lens === 'agent' ? 'How an agent reads each step.' : 'How a person reads each step.',
      toggleLens: () => this.setState({ lens: lens === 'agent' ? 'human' : 'agent' }),
      showHuman: () => this.setState({ lens: 'human' }),
      showAgent: () => this.setState({ lens: 'agent' })
    };
  }
}
</script>
</body>
</html>
