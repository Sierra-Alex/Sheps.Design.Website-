<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
</style>
</helmet>
<div style="width:100%; box-sizing:border-box; padding:0; display:flex; justify-content:center; font-family:'Inter', system-ui, sans-serif">
  <div ref="{{ overlayRef }}" role="dialog" aria-modal="true" aria-label="{{ d.piece }}" aria-hidden="{{ closed }}" onClick="{{ closePiece }}" style="position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:rgba(19,19,19,0.7); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); font-family:'Inter', system-ui, sans-serif; opacity:{{ ovOpacity }}; visibility:{{ ovVis }}; pointer-events:{{ ovEvents }}; transition:opacity 280ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear {{ ovVisDelay }}">
    <div onClick="{{ stopProp }}" style="position:relative; width:100%; max-width:560px; max-height:calc(100vh - 48px); overflow:auto; box-sizing:border-box; display:flex; flex-direction:column; gap:24px; padding:24px; background:#131313; border:1px solid #F7F3F11A; border-radius:8px; transform:translateY({{ cardShift }}); transition:transform 360ms cubic-bezier(0.22, 1, 0.36, 1)">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px">
        <div style="display:flex; flex-direction:column; gap:8px">
          <span style="font-size:12px; font-weight:500; line-height:130%; letter-spacing:0.02em; color:#949191">{{ d.step }}</span>
          <h3 style="margin:0; font-family:'Space Grotesk', sans-serif; font-size:24px; font-weight:500; line-height:100%; letter-spacing:-0.04em; color:#CAE9DF">{{ d.piece }}</h3>
        </div>
        <button type="button" onClick="{{ closePiece }}" aria-label="Close" style="appearance:none; flex:none; display:flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; border:1px solid #F7F3F11A; border-radius:4px; background:#F7F3F108; color:#F7F3F1; cursor:pointer; transition:background 200ms ease" style-hover="background:#F7F3F11A;">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="display:block"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" fill="none"></path></svg>
        </button>
      </div>
      <p style="margin:0; font-size:16px; font-weight:600; line-height:130%; letter-spacing:0.02em; color:#F7F3F1; text-wrap:pretty">{{ d.what }}</p>
      <p style="margin:0; font-size:14px; font-weight:400; line-height:145%; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ d.detail }}</p>
      <div style="display:flex; flex-direction:column; gap:8px">
        <span style="font-size:12px; font-weight:600; line-height:130%; letter-spacing:0.02em; color:#F7F3F1">What's in it</span>
        <div style="display:flex; flex-wrap:wrap; gap:8px">
          <sc-for list="{{ d.items }}" as="it" hint-placeholder-count="0">
            <span style="display:inline-flex; align-items:center; padding:4px 8px; border-radius:4px; background:#FEE7CD; color:#131313; font-size:12px; font-weight:500; line-height:130%; letter-spacing:0.02em; white-space:nowrap">{{ it }}</span>
          </sc-for>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; padding-top:16px; border-top:1px solid #F7F3F11A">
        <span style="font-size:12px; font-weight:600; line-height:130%; letter-spacing:0.02em; color:#F7F3F1">Why it matters</span>
        <p style="margin:0; font-size:14px; font-weight:400; line-height:145%; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ d.why }}</p>
      </div>
    </div>
  </div>
  <div ref="{{ rootRef }}" style="width:100%; max-width:none; container-type:inline-size; box-sizing:border-box; background:transparent; border-radius:4px; padding:0">

    

    <sc-if value="{{ compact }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; border-top:1px solid #F7F3F11A">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div role="button" tabIndex="0" aria-label="{{ r.label }}" onClick="{{ r.open }}" onKeyDown="{{ r.key }}" style="cursor:pointer; display:flex; flex-direction:column; gap:8px; padding:16px 0; border-bottom:1px solid #F7F3F11A">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px">
              <span style="font-size:14px; font-weight:600; line-height:130%; letter-spacing:0.02em; color:#F7F3F1">{{ r.piece }}</span>
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="flex:none; display:block"><path d="M6 4 L10 8 L6 12" stroke="#949191" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" fill="none"></path></svg>
            </div>
            <div style="display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px; font-size:12px; line-height:145%; letter-spacing:0.02em">
              <span style="font-weight:600; color:#F7F3F1">What</span>
              <span style="color:#949191; text-wrap:pretty">{{ r.what }}</span>
              <span style="font-weight:600; color:#F7F3F1">Why</span>
              <span style="color:#949191; text-wrap:pretty">{{ r.why }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="box-sizing:border-box; border-radius:4px; overflow:hidden; background:transparent">
    <div style="display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,2fr) minmax(0,1.6fr); gap:1.53cqw; align-items:center; padding:clamp(10px, 1.14cqw, 14px) clamp(14px, 1.53cqw, 20px); background:#F7F3F10D; border-bottom:1px solid #F7F3F11A">
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#F7F3F1">Piece</span>
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#F7F3F1">What it is</span>
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#F7F3F1">Why it matters</span>
    </div>

    <div style="display:flex; flex-direction:column">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div role="button" tabIndex="0" aria-label="{{ r.label }}" onClick="{{ r.open }}" onKeyDown="{{ r.key }}" onMouseEnter="{{ r.enter }}" onMouseLeave="{{ r.leave }}" style="cursor:pointer; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,2fr) minmax(0,1.6fr); gap:1.53cqw; align-items:start; box-sizing:border-box; padding:clamp(14px, 1.53cqw, 20px); background:{{ r.bg }}; border-top:1px solid {{ r.divider }}; opacity:{{ r.opacity }}; transition:opacity 200ms ease, background 200ms ease" style-hover="background:#F7F3F114;">
          <div style="display:flex; align-items:center; gap:8px; min-width:0">
            <svg viewBox="0 0 16 16" style="flex:none; width:16px; height:16px; display:block; color:#F7F3F1">
              <g transform="translate(3.5 2.273)">
                <path d="M 1.023 0 C 0.458 0 0 0.458 0 1.023 L 0 10.432 C 0 10.996 0.458 11.455 1.023 11.455 L 7.977 11.455 C 8.542 11.455 9 10.996 9 10.432 L 9 6.136 C 9 5.594 8.784 5.074 8.401 4.69 C 8.017 4.306 7.497 4.091 6.955 4.091 L 5.932 4.091 C 5.661 4.091 5.4 3.983 5.209 3.791 C 5.017 3.6 4.909 3.339 4.909 3.068 L 4.909 2.045 C 4.909 1.503 4.694 0.983 4.31 0.599 C 3.926 0.216 3.406 0 2.864 0 L 1.023 0 Z M 2.045 7.364 C 2.045 7.255 2.089 7.151 2.165 7.074 C 2.242 6.998 2.346 6.955 2.455 6.955 L 6.545 6.955 C 6.654 6.955 6.758 6.998 6.835 7.074 C 6.911 7.151 6.955 7.255 6.955 7.364 C 6.955 7.472 6.911 7.576 6.835 7.653 C 6.758 7.73 6.654 7.773 6.545 7.773 L 2.455 7.773 C 2.346 7.773 2.242 7.73 2.165 7.653 C 2.089 7.576 2.045 7.472 2.045 7.364 Z M 2.455 8.591 C 2.346 8.591 2.242 8.634 2.165 8.711 C 2.089 8.787 2.045 8.892 2.045 9 C 2.045 9.108 2.089 9.213 2.165 9.289 C 2.242 9.366 2.346 9.409 2.455 9.409 L 4.5 9.409 C 4.608 9.409 4.713 9.366 4.789 9.289 C 4.866 9.213 4.909 9.108 4.909 9 C 4.909 8.892 4.866 8.787 4.789 8.711 C 4.713 8.634 4.608 8.591 4.5 8.591 L 2.455 8.591 Z" fill="currentColor" fillRule="evenodd"></path>
              </g>
              <g transform="translate(8.529 2.445)">
                <path d="M 0 0 C 0.451 0.52 0.699 1.185 0.698 1.873 L 0.698 2.896 C 0.698 3.009 0.789 3.1 0.902 3.1 L 1.925 3.1 C 2.613 3.099 3.278 3.347 3.798 3.798 C 3.558 2.885 3.08 2.053 2.413 1.385 C 1.745 0.718 0.913 0.24 0 0 Z" fill="currentColor" fillRule="nonzero"></path>
              </g>
            </svg>
            <span style="font-size:clamp(14px, 1.33cqw, 16px); font-weight:600; letter-spacing:0.02em; color:#F7F3F1; text-wrap:pretty">{{ r.piece }}</span>
          </div>
          <span style="font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ r.what }}</span>
          <span style="font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ r.why }}</span>
        </div>
      </sc-for>
    </div>
    </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pastel&quot;,&quot;muted&quot;,&quot;taupe&quot;,&quot;slate&quot;,&quot;sage&quot;,&quot;bold&quot;,&quot;signal&quot;],&quot;default&quot;:&quot;signal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;dimOthers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Interaction&quot;}}">
const PALETTES = [
  { id: 'pastel', name: 'Pastel', tint: '#9CD3C11F', stroke: '#9CD3C1' },
  { id: 'muted',  name: 'Muted',  tint: '#A9B7A01F', stroke: '#A9B7A0' },
  { id: 'taupe',  name: 'Taupe',  tint: '#C6AE971F', stroke: '#C6AE97' },
  { id: 'slate',  name: 'Slate',  tint: '#9DB0BF1F', stroke: '#9DB0BF' },
  { id: 'sage',   name: 'Sage',   tint: '#9CC3B21F', stroke: '#9CC3B2' },
  { id: 'bold',   name: 'Bold',   tint: '#4FC0A11F', stroke: '#4FC0A1' },
  { id: 'signal', name: 'Signal', tint: '#FDBB6F1F', stroke: '#FDBB6F' }
];
const GROUND = 'transparent';

const ROWS = [
  { id: 'tokens', piece: 'Token file',
    what: 'Every color, size, spacing, and type value, in one place',
    why: 'Change it once, it flows everywhere' },
  { id: 'library', piece: 'Component library',
    what: 'The reusable pieces — buttons, cards, and so on — built from tokens',
    why: 'What your team and your AI tools actually build with' },
  { id: 'guidelines', piece: 'Design guidelines',
    what: 'The judgment calls — voice, layout, usage rules',
    why: "Covers what pure rules can't" },
  { id: 'contract', piece: 'Agent contract',
    what: 'The rules and skill file that teach AI how to use the system safely',
    why: 'Keeps AI-generated work on-brand automatically' },
  { id: 'living', piece: 'Living library',
    what: 'A browsable, always-current view of every token and component',
    why: "If it's not here, it doesn't exist in the system yet" }
];

const DETAIL = {"tokens":["The single source for every raw value in the system: color ramps, the type scale, spacing, radii, shadows and motion timings. Primitive tokens name what a value is; semantic tokens name the job it does, so the same file serves design tools, code and AI.",["Color ramps","Type scale","Spacing","Radii","Semantic roles"],"When a value changes, it changes in one place and every component, page and AI-generated screen picks it up. No hunting for stray hex codes."],"library":["The components your product and marketing teams reuse every day, each one consuming tokens rather than hard-coding values. Variants, states and responsive behaviour are defined once and documented with the component.",["Buttons","Forms","Cards","Navigation","Templates"],"Teams stop rebuilding the same pieces slightly differently, and AI tools assemble screens from approved parts instead of inventing new ones."],"guidelines":["The judgement that doesn't fit in a token: tone of voice, layout principles, when to use which component, and what to avoid. Written plainly, with do and don't examples.",["Voice & tone","Layout rules","Usage do’s and don’ts","Accessibility"],"Rules cover the easy cases. Guidelines cover the calls people and AI get wrong when nothing tells them otherwise."],"contract":["A written contract that tells AI agents how the system is structured and what they're allowed to do with it, packaged as instructions and skills your AI tools load before they generate anything.",["System rules","Skill files","Naming conventions","Guardrails"],"AI output stays on brand by default, instead of relying on someone to catch and fix it afterwards."],"living":["A browsable, always-up-to-date reference of every token and component, generated from the system itself so it can never drift out of date.",["Token browser","Component previews","Change log","Status"],"One place to check what exists. If a piece isn't in the library, it isn't part of the system yet."]};

class Component extends DCLogic {
  __standaloneBg = (() => { try { if (decodeURIComponent(location.pathname).includes('DiagramWhatsInside')) { document.documentElement.style.background = '#131313'; document.body.style.background = '#131313'; } } catch (e) {} })();
  overlayRef = React.createRef();
  rootRef = React.createRef();
  componentDidMount() {
    if (typeof ResizeObserver !== 'undefined' && this.rootRef.current) {
      this._wro = new ResizeObserver((es) => { const c = es[0].contentRect.width < 640; if (c !== !!this.state.compact) this.setState({ compact: c }); });
      this._wro.observe(this.rootRef.current);
    }
    this._esc = (e) => { if (e.key === 'Escape') this.setPiece(null); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this._esc);
    if (this._wro) this._wro.disconnect();
    document.documentElement.style.overflow = '';
  }
  setPiece(id) {
    document.documentElement.style.overflow = id ? 'hidden' : '';
    this.setState(id ? { openId: id, lastId: id } : { openId: null });
  }
  state = { compact: typeof window !== 'undefined' && window.innerWidth < 688, openId: null, lastId: 'tokens', hover: null, palette: 0, picked: false, propAt: null };

  renderVals() {
    const dimAmount = this.props.dimOpacity ?? 0.42;
    const dim = this.props.dimOthers ?? true;

    const hover = this.state.hover;
    const propId = this.props.palette ?? 'signal';
    const wanted = (this.state.picked && this.state.propAt === propId) ? PALETTES[this.state.palette].id : propId;
    const pIndex = Math.max(0, PALETTES.findIndex((p) => p.id === wanted));
    const skin = PALETTES[pIndex];

    const openId = this.state.openId;
    const di = Math.max(0, ROWS.findIndex((r) => r.id === this.state.lastId));
    const dr = ROWS[di], dd = DETAIL[dr.id];
    return {
      overlayRef: this.overlayRef,
      rootRef: this.rootRef,
      compact: this.state.compact ? true : null,
      wide: this.state.compact ? null : true,
      d: { piece: dr.piece, what: dr.what, why: dd[2], detail: dd[0], items: dd[1], step: String(di + 1).padStart(2, '0') + ' / ' + String(ROWS.length).padStart(2, '0') },
      closed: !openId,
      ovOpacity: openId ? 1 : 0,
      ovVis: openId ? 'visible' : 'hidden',
      ovVisDelay: openId ? '0s' : '280ms',
      ovEvents: openId ? 'auto' : 'none',
      cardShift: openId ? '0px' : '12px',
      closePiece: () => this.setPiece(null),
      stopProp: (e) => e.stopPropagation(),
      shellStroke: skin.stroke,
      headerFill: skin.tint,
      rows: ROWS.map((r, i) => ({
        piece: r.piece,
        what: r.what,
        why: r.why,
        divider: i === 0 ? 'transparent' : '#F7F3F11A',
        bg: i % 2 ? '#F7F3F108' : 'transparent',
        opacity: !dim || !hover || hover === r.id ? 1 : dimAmount,
        label: r.piece + ': more info',
        open: () => this.setPiece(r.id),
        key: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setPiece(r.id); } },
        enter: () => this.setState({ hover: r.id }),
        leave: () => this.setState({ hover: null })
      })),
      swatches: PALETTES.map((p, i) => ({
        name: p.name,
        dot: p.stroke,
        ink: i === pIndex ? '#F7F3F1' : '#949191',
        line: i === pIndex ? '#F7F3F1' : 'transparent',
        pick: () => this.setState({ palette: i, picked: true, propAt: propId })
      }))
    };
  }
}
</script>
</body>
</html>
