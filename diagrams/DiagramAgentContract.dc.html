<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
</style>
</helmet>
<div style="width:100%; box-sizing:border-box; padding:0; display:flex; justify-content:center; font-family:'Inter', system-ui, sans-serif">
  <div style="width:100%; max-width:none; container-type:inline-size; box-sizing:border-box; padding:0; background:transparent; border-radius:4px">
    
    <div ref="{{ gridRef }}" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:clamp(12px, 1.53cqw, 18px); align-items:stretch">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
        <div onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="position:relative; z-index:{{ c.z }}; cursor:default; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; min-width:0; padding:clamp(16px, 1.53cqw, 20px); border:1px solid {{ c.stroke }}; border-radius:4px; background:{{ c.fill }}; opacity:{{ c.opacity }}; transition:opacity 200ms ease">
          <div data-head="" style="display:flex; flex-direction:{{ headDir }}; align-items:{{ headAlign }}; gap:{{ headGap }}; min-width:0">
            <div style="display:flex; align-items:center; gap:8px; flex:none">
            <svg viewBox="0 0 16 16" style="flex:none; width:16px; height:16px; display:block; color:#F7F3F1">
              <g transform="translate(3.5 2.273)">
                <path d="M 1.023 0 C 0.458 0 0 0.458 0 1.023 L 0 10.432 C 0 10.996 0.458 11.455 1.023 11.455 L 7.977 11.455 C 8.542 11.455 9 10.996 9 10.432 L 9 6.136 C 9 5.594 8.784 5.074 8.401 4.69 C 8.017 4.306 7.497 4.091 6.955 4.091 L 5.932 4.091 C 5.661 4.091 5.4 3.983 5.209 3.791 C 5.017 3.6 4.909 3.339 4.909 3.068 L 4.909 2.045 C 4.909 1.503 4.694 0.983 4.31 0.599 C 3.926 0.216 3.406 0 2.864 0 L 1.023 0 Z M 2.045 7.364 C 2.045 7.255 2.089 7.151 2.165 7.074 C 2.242 6.998 2.346 6.955 2.455 6.955 L 6.545 6.955 C 6.654 6.955 6.758 6.998 6.835 7.074 C 6.911 7.151 6.955 7.255 6.955 7.364 C 6.955 7.472 6.911 7.576 6.835 7.653 C 6.758 7.73 6.654 7.773 6.545 7.773 L 2.455 7.773 C 2.346 7.773 2.242 7.73 2.165 7.653 C 2.089 7.576 2.045 7.472 2.045 7.364 Z M 2.455 8.591 C 2.346 8.591 2.242 8.634 2.165 8.711 C 2.089 8.787 2.045 8.892 2.045 9 C 2.045 9.108 2.089 9.213 2.165 9.289 C 2.242 9.366 2.346 9.409 2.455 9.409 L 4.5 9.409 C 4.608 9.409 4.713 9.366 4.789 9.289 C 4.866 9.213 4.909 9.108 4.909 9 C 4.909 8.892 4.866 8.787 4.789 8.711 C 4.713 8.634 4.608 8.591 4.5 8.591 L 2.455 8.591 Z" fill="currentColor" fillRule="evenodd"></path>
              </g>
              <g transform="translate(8.529 2.445)">
                <path d="M 0 0 C 0.451 0.52 0.699 1.185 0.698 1.873 L 0.698 2.896 C 0.698 3.009 0.789 3.1 0.902 3.1 L 1.925 3.1 C 2.613 3.099 3.278 3.347 3.798 3.798 C 3.558 2.885 3.08 2.053 2.413 1.385 C 1.745 0.718 0.913 0.24 0 0 Z" fill="currentColor" fillRule="nonzero"></path>
              </g>
            </svg>
            <span style="font-size:clamp(14px, 1.33cqw, 16px); font-weight:600; letter-spacing:0.02em; color:#F7F3F1; white-space:nowrap">{{ c.file }}</span>
            </div>
            <span style="flex:none; width:1px; height:11px; background:#F7F3F1; display:{{ divDisplay }}"></span>
            <span style="font-size:clamp(14px, 1.33cqw, 16px); font-weight:400; letter-spacing:0.02em; color:#F7F3F1; white-space:nowrap">{{ c.name }}</span>
          </div>
          <div style="font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:#949191; text-wrap:pretty">{{ c.body }}</div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ showNote }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:clamp(12px, 1.53cqw, 18px); box-sizing:border-box; padding:16px 20px; border:1px solid #F7F3F11A; border-radius:4px; background:#F7F3F108; font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:#949191; text-wrap:pretty">Without this layer, a design system is just a resource sitting there, unread. With it, an agent can work inside your brand instead of guessing at it.</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pastel&quot;,&quot;muted&quot;,&quot;taupe&quot;,&quot;slate&quot;,&quot;sage&quot;,&quot;bold&quot;,&quot;signal&quot;],&quot;default&quot;:&quot;signal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;showNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;dimOthers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Interaction&quot;}}">
const PALETTES = [
  { id: 'pastel', name: 'Pastel', tint: '#9CD3C11F', stroke: '#9CD3C1' },
  { id: 'muted',  name: 'Muted',  tint: '#A9B7A01F', stroke: '#A9B7A0' },
  { id: 'taupe',  name: 'Taupe',  tint: '#C6AE971F', stroke: '#C6AE97' },
  { id: 'slate',  name: 'Slate',  tint: '#9DB0BF1F', stroke: '#9DB0BF' },
  { id: 'sage',   name: 'Sage',   tint: '#9CC3B21F', stroke: '#9CC3B2' },
  { id: 'bold',   name: 'Bold',   tint: '#4FC0A11F', stroke: '#4FC0A1' },
  { id: 'signal', name: 'Signal', tint: '#FDBB6F1F', stroke: '#FDBB6F' }
];

const CARDS = [
  { id: 'rules', file: 'rules.md', name: 'The rules',
    body: "Hard constraints on how tokens and components get used, so AI-generated work stays on-system by default, not by luck.",
    lines: ["Components use semantic tokens only. Never primitives.", "No hard-coded colours, radii or spacing.", "Use an existing component before building a new one."] },
  { id: 'guidelines', file: 'guidelines.md', name: 'The guidelines',
    body: "The visual and UX judgment calls the rules can't cover. Where AI, and people, need context instead of just constraints.",
    lines: ["One primary action per screen.", "Sentence case for every UI label.", "When space is tight, drop the icon before the label."] },
  { id: 'skill', file: 'skill.md', name: 'The skill',
    body: "A short file that teaches an agent when and how to use the system at all. Without it, even a perfectly built system is invisible.",
    lines: ["Use when: building or editing any UI for this brand.", "Read rules.md first, then guidelines.md.", "Pull every value from tokens.json."] }
];

class Component extends DCLogic {
  __standaloneBg = (() => { try { if (decodeURIComponent(location.pathname).includes('DiagramAgentContract')) { document.documentElement.style.background = '#131313'; document.body.style.background = '#131313'; } } catch (e) {} })();
  gridRef = React.createRef();
  componentDidMount() {
    this._measure = () => {
      const g = this.gridRef.current; if (!g) return;
      const need = [...g.querySelectorAll('[data-head]')].some((h) => {
        let w = 0; for (const c of h.children) if (getComputedStyle(c).display !== 'none') w += c.scrollWidth;
        return w + 16 > h.clientWidth;
      });
      if (need !== !!this.state.stackHead) this.setState({ stackHead: need });
    };
    this._ro = new ResizeObserver((es) => { const w = Math.round(es[0].contentRect.width); if (w === this._w) return; this._w = w; this.setState({ stackHead: false }, () => requestAnimationFrame(this._measure)); });
    if (this.gridRef.current) this._ro.observe(this.gridRef.current);
    requestAnimationFrame(this._measure);
  }
  componentWillUnmount() { this._ro && this._ro.disconnect(); }
  state = { pinned: null, hover: null, palette: 0, picked: false, propAt: null };

  renderVals() {
    const dim = this.props.dimOthers ?? true;
    const dimAmount = this.props.dimOpacity ?? 0.42;
    const hover = this.state.hover;
    const propId = this.props.palette ?? 'signal';
    const wanted = (this.state.picked && this.state.propAt === propId) ? PALETTES[this.state.palette].id : propId;
    const pIndex = Math.max(0, PALETTES.findIndex((p) => p.id === wanted));
    const skin = PALETTES[pIndex];

    const cards = CARDS.map((c) => ({
      id: c.id,
      file: c.file,
      name: c.name,
      body: c.body,
      fill: 'transparent',
      stroke: skin.stroke,
      opacity: !dim || !hover || hover === c.id ? 1 : dimAmount,
      lines: c.lines.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })),
      open: (hover === c.id || this.state.pinned === c.id) ? true : null,
      z: (hover === c.id || this.state.pinned === c.id) ? 3 : 1,
      toggle: () => this.setState((s) => ({ pinned: s.pinned === c.id ? null : c.id })),
      enter: () => this.setState({ hover: c.id }),
      leave: () => this.setState({ hover: null, pinned: null })
    }));

    const swatches = PALETTES.map((p, i) => ({
      name: p.name,
      dot: p.stroke,
      ink: i === pIndex ? '#F7F3F1' : '#949191',
      line: i === pIndex ? '#F7F3F1' : 'transparent',
      pick: () => this.setState({ palette: i, picked: true, propAt: propId })
    }));

    return {
      gridRef: this.gridRef,
      headDir: this.state.stackHead ? 'column' : 'row',
      headAlign: this.state.stackHead ? 'flex-start' : 'center',
      headGap: this.state.stackHead ? '4px' : '8px',
      divDisplay: this.state.stackHead ? 'none' : 'block', cards, swatches, showNote: (this.props.showNote ?? false) ? true : null };
  }
}
</script>
</body>
</html>
