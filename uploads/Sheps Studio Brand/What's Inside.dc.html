<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F7F3F1; font-family: "Inter", system-ui, sans-serif; }
  a { color: #8A5210; text-decoration: none; }
  a:hover { color: #171717; }
</style>
</helmet>
<div style="width:100%; box-sizing:border-box; padding:2.5rem 1.25rem; display:flex; justify-content:center; font-family:'Inter', system-ui, sans-serif">
  <div style="width:100%; max-width:1180px; container-type:inline-size; box-sizing:border-box; background:#F7F3F1; border-radius:8px; padding:clamp(20px, 3.05cqw, 36px)">

    <div style="display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:clamp(16px, 2.3cqw, 26px)">
      <sc-for list="{{ swatches }}" as="p" hint-placeholder-count="7">
        <button type="button" onClick="{{ p.pick }}" style="appearance:none; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:400; letter-spacing:0.02em; padding:0 0 4px; border:0; border-bottom:1px solid {{ p.line }}; background:none; color:{{ p.ink }}">
          <span style="width:9px; height:9px; border-radius:50%; background:{{ p.dot }}"></span>
          {{ p.name }}
        </button>
      </sc-for>
    </div>

    <div style="box-sizing:border-box; border:1px solid {{ shellStroke }}; border-radius:8px; overflow:hidden; background:#F7F3F1">
    <div style="display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,2fr) minmax(0,1.6fr); gap:1.53cqw; align-items:center; padding:clamp(10px, 1.14cqw, 14px) clamp(14px, 1.53cqw, 20px); background:{{ headerFill }}; border-bottom:1px solid {{ shellStroke }}">
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#171717">Piece</span>
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#171717">What it is</span>
      <span style="font-size:clamp(13px, 1.14cqw, 15px); font-weight:600; letter-spacing:0.02em; color:#171717">Why it matters</span>
    </div>

    <div style="display:flex; flex-direction:column">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div onMouseEnter="{{ r.enter }}" onMouseLeave="{{ r.leave }}" style="display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,2fr) minmax(0,1.6fr); gap:1.53cqw; align-items:start; box-sizing:border-box; padding:clamp(14px, 1.53cqw, 20px); background:#F7F3F1; border-top:1px solid {{ r.divider }}; opacity:{{ r.opacity }}; transition:opacity 200ms ease">
          <div style="display:flex; align-items:center; gap:8px; min-width:0">
            <svg viewBox="0 0 16 16" style="flex:none; width:16px; height:16px; display:block; color:#171717">
              <g transform="translate(3.5 2.273)">
                <path d="M 1.023 0 C 0.458 0 0 0.458 0 1.023 L 0 10.432 C 0 10.996 0.458 11.455 1.023 11.455 L 7.977 11.455 C 8.542 11.455 9 10.996 9 10.432 L 9 6.136 C 9 5.594 8.784 5.074 8.401 4.69 C 8.017 4.306 7.497 4.091 6.955 4.091 L 5.932 4.091 C 5.661 4.091 5.4 3.983 5.209 3.791 C 5.017 3.6 4.909 3.339 4.909 3.068 L 4.909 2.045 C 4.909 1.503 4.694 0.983 4.31 0.599 C 3.926 0.216 3.406 0 2.864 0 L 1.023 0 Z M 2.045 7.364 C 2.045 7.255 2.089 7.151 2.165 7.074 C 2.242 6.998 2.346 6.955 2.455 6.955 L 6.545 6.955 C 6.654 6.955 6.758 6.998 6.835 7.074 C 6.911 7.151 6.955 7.255 6.955 7.364 C 6.955 7.472 6.911 7.576 6.835 7.653 C 6.758 7.73 6.654 7.773 6.545 7.773 L 2.455 7.773 C 2.346 7.773 2.242 7.73 2.165 7.653 C 2.089 7.576 2.045 7.472 2.045 7.364 Z M 2.455 8.591 C 2.346 8.591 2.242 8.634 2.165 8.711 C 2.089 8.787 2.045 8.892 2.045 9 C 2.045 9.108 2.089 9.213 2.165 9.289 C 2.242 9.366 2.346 9.409 2.455 9.409 L 4.5 9.409 C 4.608 9.409 4.713 9.366 4.789 9.289 C 4.866 9.213 4.909 9.108 4.909 9 C 4.909 8.892 4.866 8.787 4.789 8.711 C 4.713 8.634 4.608 8.591 4.5 8.591 L 2.455 8.591 Z" fill="currentColor" fillRule="evenodd"></path>
              </g>
              <g transform="translate(8.529 2.445)">
                <path d="M 0 0 C 0.451 0.52 0.699 1.185 0.698 1.873 L 0.698 2.896 C 0.698 3.009 0.789 3.1 0.902 3.1 L 1.925 3.1 C 2.613 3.099 3.278 3.347 3.798 3.798 C 3.558 2.885 3.08 2.053 2.413 1.385 C 1.745 0.718 0.913 0.24 0 0 Z" fill="currentColor" fillRule="nonzero"></path>
              </g>
            </svg>
            <span style="font-size:clamp(14px, 1.33cqw, 16px); font-weight:600; letter-spacing:0.02em; color:#171717; text-wrap:pretty">{{ r.piece }}</span>
          </div>
          <span style="font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:rgba(23,23,23,0.7); text-wrap:pretty">{{ r.what }}</span>
          <span style="font-size:clamp(12px, 1.14cqw, 14px); font-weight:400; line-height:1.45; letter-spacing:0.02em; color:rgba(23,23,23,0.7); text-wrap:pretty">{{ r.why }}</span>
        </div>
      </sc-for>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pastel&quot;,&quot;muted&quot;,&quot;taupe&quot;,&quot;slate&quot;,&quot;sage&quot;,&quot;bold&quot;,&quot;signal&quot;],&quot;default&quot;:&quot;signal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;dimOthers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;},&quot;dimOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Interaction&quot;}}">
const PALETTES = [
  { id: 'pastel', name: 'Pastel', tint: '#EAF6F1', stroke: '#9CD3C1' },
  { id: 'muted',  name: 'Muted',  tint: '#EDF0EB', stroke: '#A9B7A0' },
  { id: 'taupe',  name: 'Taupe',  tint: '#F3EAE2', stroke: '#C6AE97' },
  { id: 'slate',  name: 'Slate',  tint: '#E9EEF3', stroke: '#9DB0BF' },
  { id: 'sage',   name: 'Sage',   tint: '#E4F0EA', stroke: '#9CC3B2' },
  { id: 'bold',   name: 'Bold',   tint: '#E3F7EE', stroke: '#4FC0A1' },
  { id: 'signal', name: 'Signal', tint: '#F8E8D7', stroke: '#FDBB6F' }
];
const GROUND = '#F7F3F1';

const ROWS = [
  { id: 'tokens', piece: 'Token file',
    what: 'Every color, size, spacing, and type value, in one place',
    why: 'Change it once, it flows everywhere' },
  { id: 'library', piece: 'Component library',
    what: 'The reusable pieces — buttons, cards, and so on — built from tokens',
    why: 'What your team and your AI tools actually build with' },
  { id: 'guidelines', piece: 'Design guidelines',
    what: 'The judgment calls — voice, layout, usage rules',
    why: "Covers what pure rules can't" },
  { id: 'contract', piece: 'Agent contract',
    what: 'The rules and skill file that teach AI how to use the system safely',
    why: 'Keeps AI-generated work on-brand automatically' },
  { id: 'living', piece: 'Living library',
    what: 'A browsable, always-current view of every token and component',
    why: "If it's not here, it doesn't exist in the system yet" }
];

class Component extends DCLogic {
  state = { hover: null, palette: 0, picked: false, propAt: null };

  renderVals() {
    const dimAmount = this.props.dimOpacity ?? 0.42;
    const dim = this.props.dimOthers ?? true;

    const hover = this.state.hover;
    const propId = this.props.palette ?? 'signal';
    const wanted = (this.state.picked && this.state.propAt === propId) ? PALETTES[this.state.palette].id : propId;
    const pIndex = Math.max(0, PALETTES.findIndex((p) => p.id === wanted));
    const skin = PALETTES[pIndex];

    return {
      shellStroke: skin.stroke,
      headerFill: skin.tint,
      rows: ROWS.map((r, i) => ({
        piece: r.piece,
        what: r.what,
        why: r.why,
        divider: i === 0 ? 'transparent' : 'rgba(23,23,23,0.08)',
        opacity: !dim || !hover || hover === r.id ? 1 : dimAmount,
        enter: () => this.setState({ hover: r.id }),
        leave: () => this.setState({ hover: null })
      })),
      swatches: PALETTES.map((p, i) => ({
        name: p.name,
        dot: p.stroke,
        ink: i === pIndex ? 'rgb(23,23,23)' : 'rgba(23,23,23,0.6)',
        line: i === pIndex ? 'rgb(23,23,23)' : 'transparent',
        pick: () => this.setState({ palette: i, picked: true, propAt: propId })
      }))
    };
  }
}
</script>
</body>
</html>
