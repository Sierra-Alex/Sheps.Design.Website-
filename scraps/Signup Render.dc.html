<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./fig-signup/fig-assets.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Serif:wght@400;500&display=swap"><style>body{margin:0}</style></helmet>
<div id="shot" style="width:1440px;height:823px;"><x-import component-from-global-scope="GridSystem" from="./fig-signup/Components.bundle.js" hint-size="1440px,823px"></x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const G = '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
    const t = setInterval(() => { const s = [...document.querySelectorAll('span')].find(x => x.textContent === 'Sign up with Google'); const el = s && s.previousElementSibling; if (el) { el.innerHTML = G; clearInterval(t); this.glass(); } }, 100);
  }
  glass() {
    const shot = document.querySelector('#shot'), all = [...shot.querySelectorAll('div')];
    const bg = all.find(d => getComputedStyle(d).backgroundImage.includes('52197a52')), cloud = all.find(d => getComputedStyle(d).backgroundImage.includes('ad051887'));
    if (!bg || !cloud) return setTimeout(() => this.glass(), 150);
    const card = bg.firstElementChild, bb = getComputedStyle(bg).backgroundImage.replace(/"/g, "'"), cb = getComputedStyle(cloud).backgroundImage.replace(/"/g, "'");
    Object.assign(card.style, { position: 'relative', zIndex: '1', overflow: 'hidden', isolation: 'isolate' });
    cloud.style.zIndex = '2'; cloud.style.pointerEvents = 'none';
    [...card.children].forEach(c => { if (getComputedStyle(c).position === 'static') c.style.position = 'relative'; c.style.zIndex = '1'; });
    const bd = document.createElement('div');
    bd.style.cssText = 'position:absolute;left:-265px;top:-93px;width:1440px;height:823px;z-index:0;filter:blur(24px);pointer-events:none;';
    bd.innerHTML = `<div style="position:absolute;inset:0;background-image:${bb};background-size:cover;background-position:center;"></div><div style="position:absolute;left:0;top:355px;width:1440px;height:468px;background-image:${cb};background-size:cover;background-position:center;"></div><div style="position:absolute;inset:0;background:rgba(255,255,255,0.25);"></div>`;
    card.insertBefore(bd, card.firstChild);
    const hl = [...shot.querySelectorAll('span,p,h1,div')].find(e => e.textContent.trim() === 'Signup for your trial' && !e.children.length);
    if (hl) hl.style.letterSpacing = '-0.03em';
    document.body.dataset.ready = '1';
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
