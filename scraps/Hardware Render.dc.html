<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./fig-hardware/fig-tokens.css"><link rel="stylesheet" href="./fig-hardware/fig-assets.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Serif:wght@400;500&display=swap"><style>body{margin:0}</style></helmet>
<div id="shot" style="width:1440px;"><x-import component-from-global-scope="GridSystem" from="./fig-hardware/Components.bundle.js" hint-size="1440px,7191px"></x-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const t = setInterval(() => {
      const shot = document.querySelector('#shot');
      if (!shot || shot.querySelectorAll('div').length < 50) return;
      clearInterval(t);
      shot.querySelectorAll('div').forEach(d => {
        const p = d.parentElement, cs = getComputedStyle(d);
        if (cs.flexGrow === '1' && p && getComputedStyle(p).flexDirection === 'row') { d.style.flexBasis = '0'; d.style.minWidth = '0'; }
      });
      shot.querySelectorAll('svg').forEach(v => { const b = v.getBoundingClientRect(); if (Math.round(b.width) === 510 && Math.round(b.height) === 478) v.style.display = 'none'; });
      document.body.dataset.ready = '1';
    }, 200);
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
